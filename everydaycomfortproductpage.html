<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Everyday Comfort Tee by Summerset. Something simple and comfortable to wear throughout the day. PHP499.">
  <title>Everyday Comfort Tee | Summerset</title>
 
  <!--Bootstrap 6 CSS-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
 
  <!--Google Fonts-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">
 
  <!--CSS stylesheet -->
  <link rel="stylesheet" href="css/productstyle.css">
</head>
 
<body class="d-flex flex-column min-dvh-100">
 
  <!-- WEBSITE HEADER AND THE NAVBARSS ᓚᘏᗢ -->
  <header>
    <nav class="navbar navbar-expand-md site-navbar" aria-label="Main navigation">
      <div class="container-xl">
        <a class="navbar-brand" href="index.html">
          <img src="images/logo-mark.svg" alt="Summerset logo – go to home page" class="brand-logo">
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false"
                aria-label="Toggle navigation menu">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-md-4 gap-md-3">
            <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#shop">Shop</a></li>
            <li class="nav-item"><a class="nav-link" href="index.html#about">About</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>
 
 
  <!--Product-->
  <main class="container flex-grow-1 py-12">
    <div class="row gap-6 mt-8">
 
      <div class="md:col-6">
        <!--Input appropriate tshirt design in #-->
        <img src="images/everyday-comfort-tee.svg" class="img-fluid" alt="White Everyday Comfort Tee">
      </div>

     
      <div class="md:col-5">
        <h1 class="product-title" id="productName">Everyday Comfort Tee</h1>
        <p class="product-price fs-md mb-0" style="margin-bottom: 0px;">PHP<span id="productPrice">499</span></p>
 
        <p class="product-description fs-md">Something simple and comfortable to wear throughout the day.</p>
 
        <p class="fs-md my-4" id="sizeLabel">Select a size:</p>
        <div class="d-flex flex-wrap gap-4" role="group" aria-labelledby="sizeLabel">
          <button type="button" class="btn-solid btn-styled size-btn px-7 rounded-0" data-size="S" aria-pressed="false">S</button>
          <button type="button" class="btn-solid btn-styled size-btn px-7 rounded-0" data-size="M" aria-pressed="true">M</button>
          <button type="button" class="btn-solid btn-styled size-btn px-7 rounded-0" data-size="L" aria-pressed="false">L</button>
          <button type="button" class="btn-solid btn-styled size-btn px-7 rounded-0" data-size="XL" aria-pressed="false">XL</button>
          <button type="button" class="btn-solid btn-styled size-btn px-7 rounded-0" data-size="XXL" aria-pressed="false">XXL</button>
        </div>
 
        <label class="fs-md d-block my-4" for="qty">Quantity:</label>
        <div class="btn-group btn-group-divider" role="group" aria-label="Quantity">
          <button type="button" id="minus" class="btn-solid btn-styled px-7" aria-label="Decrease quantity">-</button>
          <input id="qty" name="qty" type="number" class="form-control w-4" value="1" min="1" max="99" inputmode="numeric" style="background-color: #ffffff; color: #000000; text-align: center; padding: 0;">
          <button type="button" id="plus" class="btn-solid btn-styled px-7" aria-label="Increase quantity">+</button>
        </div>
 
        <button type="button" id="orderBtn" class="btn-solid order-btn py-2 mt-4">Order Now</button>
      </div>
 
    </div>
  </main>

  <!--Footer-->
<footer class="site-footer border-top mt-auto">
    <div class="container d-flex flex-wrap justify-content-center align-items-center gap-2">
    <span class="mb-0">Summerset &copy; 2026</span>
    <nav aria-label="Footer">
        <ul class="nav">
            <!--Insert appropriate links in #-->
            <li class="nav-item"><a class="nav-link px-2" href="Privacy Policy.html"> Privacy </a></li>
            <li class="nav-item"><a class="nav-link px-2" href="Privacy Policy.html"> Terms </a></li>
        </ul>
    </nav>
    </div>
</footer>

<!--JavaScript-->
<script src="js/productscript.js">
</script>

        <!--Bootstrap JavaScript-->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    </body>
