<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8"
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title> Contact | Summerset</title>

	<!--Bootstrap 6.0 Link-->
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">

	<!--Google Fonts Link-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

	<!--CSS Stylesheet-->
	<link rel="stylesheet" href="css/contact-privacystyle.css">
	<!--Javascript for Email Inquiry-->
	<script src="js/scriptmail.js" defer></script>
	</head>

<body class="d-flex flex-column min-vh-100">

<!--Header Navigation Bar-->
<nav class="navbar md:navbar-expand bg-1 border-bottom">
    <div class="container d-flex justify-content-between align-items-center">
        <!--Insert Summerset Logo online photo link in #-->
        <a class="navbar-brand" href="#" aria-label="Summerset Webpage Home">Summerset</a>
        <!--Set Hamburger menu on right side on Mobile-->
        <button class="btn-icon navbar-toggler ms-auto md:hidden" type="button"
            data-bs-toggle="drawer" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class ="navbar-toggler-icon" aria-hidden="true"></span>
        </button>
        <!--Navigation Menu in desktop, insert appropriate links in #-->
            <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
                <div class="drawer-body">
                    <ul class="nav navbar-nav">
                        <li class="nav-item"><a class="nav-link" href="index.html"> Home </a></li>
                        <li class="nav-item"><a class="nav-link" href="#"> Shop </a></li>
                        <li class="nav-item"><a class="nav-link" href="#"> About </a></li>
                        <li class="nav-item"><a class="nav-link active" aria-current="page" href="contact.html"> Contact </a></li>
                    </ul>
                </div>
            </dialog>
    </div>
</nav>

	<!--Contact Page-->
	<div class="contact-container">
		<section class="contact-column">
			<h1 class = "header-contact">Contact Us</h1>

			<div class="contactdetails">
				<div class = "item">
					<img src = "images/email-icon.png" class= "icon" alt = "Email Icon">
					<h2>Email</h2>
					<p>hello@examplewebsite142.com</p>
				</div>
				<div class = "item">
					<img src = "images/phone-icon.png" class = "icon" alt = "Phone Icon">
					<h2>Phone</h2>
					<p> +XX XXXXXXX</p>
				</div>

				<div class = "item">
					<img src = "images/building-icon.png" class = "icon" alt = "Building Icon">
					<h2>Location</h2>
					<p>Philippines</p>
				</div>

				<div class = "item">
					<img src = "images/clock-icon.png" class = "icon" alt = "Class Icon">
					<h2>Work Hours</h2>
					<p>XX:XX-XX:XX</p>
				</div>
			</div>
		</section>
  
		<section class="contact-column">
			<h1 class = "header-contact">Need Any Help?</h1>

			<form class = "contact-form" id = "contact-form" action="#" method="post">
				<p class = "instruction">Send us a message and we will be back with you shortly within 24 hours.</p>
  				<label for="full-name">Full name</label>
  				<input type="text" id="full-name" name="full_name" required autocomplete="name">
				<label for="email">Email (example@example.com)</label>
 				<input type="email" id="email" name="email" required autocomplete="email">
				
				<label for="message">Message</label>
				<textarea class="fixed-textbox" id="message" name="message" rows="6" required></textarea>
				<button class="email-button" type="submit">SUBMIT</button>
			</form>
		</section>
	</div>

</main>

<!--Footer-->
<footer class="bg-2 border-top py-4 mt-auto">
    <div class="container d-flex flex-wrap justify-content-center align-items-center gap-2">
    <span class="mb-0">Summerset &copy; 2026</span>

        </ul>
    </nav>
    </div>
</footer>

    </body>

</body>
</html>
